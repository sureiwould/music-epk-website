
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="gallery.js" defer></script>
    <title>Gallery | Kevin Sclar</title>
</head>

<body>

<header class="site-header">

    <a href="index.html" class="logo">Kevin Sclar</a>

    <nav aria-label="Main navigation">
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="performances.html">Performances</a></li>
            <li><a href="gallery.html" aria-current="page">Gallery</a></li>
            <li><a href="services.html">Services</a></li>
        </ul>
    </nav>

    <a href="contact.html" class="contact-btn">Contact</a>

</header>

<main>

    <!-- Featured Slideshow -->
    <section id="gallery">

        <h1>Gallery</h1>

        <div class="slideshow" aria-label="Featured photographs">

            <div class="slides">

                <img src="images/grill2.jpg"
                     class="active"
                     alt="under the bridge">

                <img src="images/battlenight.png"
                     alt="battle of the bands">

                <img src="images/kava2.jpeg"
                     alt="behind the scenes">

            </div>

            <button class="slide-prev"
                    type="button"
                    aria-label="Previous photograph">
                &#10094;
            </button>

            <button class="slide-next"
                    type="button"
                    aria-label="Next photograph">
                &#10095;
            </button>

        </div>

    </section>

    <!-- Photo Gallery -->
    <section id="photo-gallery">

        <h2>Photo Gallery</h2>

        <div class="gallery-grid">

            <button class="gallery-image" type="button">
                <img src="images/battle.jpg"
                     alt="Battle of The Bands"
                     loading="lazy">
            </button>

            <button class="gallery-image" type="button">
                <img src="images/papas3.jpg"
                     alt="Playing at Papa's"
                     loading="lazy">
            </button>

            <button class="gallery-image" type="button">
                <img src="images/outside.jpeg"
                     alt="Playing Outside"
                     loading="lazy">
            </button>

            <button class="gallery-image" type="button">
                <img src="images/boil.png"
                     alt="Crabfish Boil"
                     loading="lazy">
            </button>

            <button class="gallery-image" type="button">
                <img src="images/fourth.jpg"
                     alt="Fourth of July"
                     loading="lazy">
            </button>

            <button class="gallery-image" type="button">
                <img src="images/papas2.jpg"
                     alt="Playing at Papas again"
                     loading="lazy">
            </button>

        </div>

    </section>

    <!-- Enlarged Photograph -->
    <dialog class="lightbox" aria-label="Enlarged photograph">

        <button class="lightbox-close"
                type="button"
                aria-label="Close photograph">
            &times;
        </button>

        <img src="" alt="">

    </dialog>

</main>

<footer>
    <p>Kevin Sclar</p>
    <p>Guitarist &amp; Musician</p>
    <p>Instagram | YouTube | Spotify</p>
    <p>&copy; 2026 Kevin Sclar. All rights reserved.</p>
</footer>

</body>

</html>
